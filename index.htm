<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caça Visual - Neon Edition</title>
    <style>
        :root {
            --bg-body: #050811;
            --panel-bg: #0D1322;
            --neon-cyan: #00F0FF;
            --neon-magenta: #FF007A;
            --neon-yellow: #FFE600;
            --neon-green: #00FF66;
            --text-main: #FFFFFF;
            --text-muted: #64748B;
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(255, 0, 122, 0.15) 0%, transparent 50%);
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            background: var(--panel-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        @media (min-width: 441px) {
            #app-container {
                height: 92vh;
                border-radius: 24px;
            }
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
            transform: scale(0.96);
            z-index: 1;
            overflow-y: auto;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            z-index: 2;
        }

        .arcade-title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            color: #FFF;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: var(--neon-cyan);
            font-size: 0.85rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-game {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 14px 18px;
            border-radius: var(--radius-main);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-game:active {
            transform: scale(0.96);
            background: var(--neon-cyan);
            color: #000;
        }

        .btn-magenta { border-color: var(--neon-magenta); color: var(--neon-magenta); }
        .btn-magenta:active { background: var(--neon-magenta); color: #FFF; }

        .btn-yellow { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .btn-yellow:active { background: var(--neon-yellow); color: #000; }

        .btn-green { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-green:active { background: var(--neon-green); color: #000; }

        .btn-subtle { border-color: rgba(255, 255, 255, 0.15); color: var(--text-muted); }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-main);
            padding: 10px 6px;
            text-align: center;
        }
        .hud-box .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; display: block; }
        .hud-box .val { font-size: 1.1rem; font-weight: 900; color: #FFF; margin-top: 2px; }

        .challenge-card {
            flex: 1;
            background: linear-gradient(180deg, rgba(13, 19, 34, 0.8) 0%, rgba(5, 8, 17, 0.9) 100%);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-main);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            margin-bottom: 16px;
        }

        .badge-cat {
            background: var(--neon-magenta);
            color: #FFF;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            position: absolute;
            top: 16px;
            letter-spacing: 1px;
        }

        .challenge-title {
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.4;
            color: #FFF;
            margin: 20px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        #cam-viewport { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .cam-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            display: flex; gap: 10px; z-index: 10;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 16px;
        }
        .gallery-box {
            aspect-ratio: 1;
            border-radius: var(--radius-main);
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }
        .gallery-box img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-box .no-img {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: var(--text-muted); text-align: center; padding: 10px;
        }
        .gallery-box .tag {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.85); font-size: 0.6rem; color: #FFF;
            padding: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
        }

        #toast-bar {
            position: absolute; top: 16px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--neon-yellow); color: #000;
            padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; font-weight: 900;
            box-shadow: 0 0 15px var(--neon-yellow);
            transition: transform 0.3s ease;
            z-index: 999;
        }
        #toast-bar.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="toast-bar">+100 PTS!</div>

        <!-- MENU INICIAL -->
        <section id="screen-menu" class="screen active" style="justify-content: center;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="font-size: 3.5rem; margin-bottom: 10px;">📸</div>
                <h1 class="arcade-title">CAÇA VISUAL</h1>
                <p class="subtitle">Caça ao Tesouro Fotográfica</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <button class="btn-game" onclick="App.setupGame('classico')">Modo Caçada Livre</button>
                <button class="btn-game btn-magenta" onclick="App.setupGame('surpresa')">Modo Surpresa / Desafio</button>
            </div>
        </section>

        <!-- CONFIGURAÇÃO DA PARTIDA -->
        <section id="screen-config" class="screen">
            <h1 class="arcade-title" style="font-size: 1.5rem;">CONFIGURAR</h1>
            <p class="subtitle" id="config-subtitle">Ajuste os parâmetros</p>

            <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: auto;">
                <div>
                    <label style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase;">Número de Missões</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;">
                        <button class="btn-game btn-subtle cfg-rounds selected" style="border-color: var(--neon-cyan);" onclick="App.setCfg('rounds', 5, this)">5</button>
                        <button class="btn-game btn-subtle cfg-rounds" onclick="App.setCfg('rounds', 10, this)">10</button>
                        <button class="btn-game btn-subtle cfg-rounds" onclick="App.setCfg('rounds', 15, this)">15</button>
                    </div>
                </div>
            </div>

            <button class="btn-game btn-green" style="margin-bottom: 8px;" onclick="App.startSession()">[ INICIAR JOGO ]</button>
            <button class="btn-game btn-subtle" onclick="App.showScreen('screen-menu')">Voltar</button>
        </section>

        <!-- TELA DO JOGO (GAMEPLAY) -->
        <section id="screen-gameplay" class="screen">
            <div class="hud-grid">
                <div class="hud-box">
                    <span class="lbl">Missão</span>
                    <span class="val" id="hud-mira">1/5</span>
                </div>
                <div class="hud-box">
                    <span class="lbl">Combo</span>
                    <span class="val" id="hud-combo" style="color: var(--neon-magenta);">x1</span>
                </div>
                <div class="hud-box">
                    <span class="lbl">Score</span>
                    <span class="val" id="hud-score" style="color: var(--neon-yellow);">0</span>
                </div>
            </div>

            <div class="challenge-card">
                <span class="badge-cat" id="card-cat-text">CATEGORIA</span>
                <p class="challenge-title" id="card-main-text">Carregando...</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-game btn-yellow" onclick="App.openCam()">📷 Tirar Foto Pelo App</button>
                <button class="btn-game btn-green" onclick="App.completeManual()">✓ Concluir (Câmera Externa / Sem Foto)</button>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="btn-game btn-subtle" style="font-size: 0.75rem;" onclick="App.skipMission()">⏩ Pular Missão</button>
                    <button class="btn-game btn-magenta" style="font-size: 0.75rem;" onclick="App.exitGame()">🚪 Sair</button>
                </div>
            </div>
        </section>

        <!-- CÂMERA INTEGRADA -->
        <section id="screen-cam" class="screen" style="padding: 0;">
            <video id="cam-viewport" autoplay playsinline></video>
            <canvas id="cam-canvas" style="display: none;"></canvas>
            <div class="cam-controls">
                <button class="btn-game btn-subtle" style="flex: 1;" onclick="App.closeCam()">Voltar</button>
                <button class="btn-game btn-yellow" style="flex: 2;" onclick="App.snap()">CAPTURAR</button>
            </div>
        </section>

        <!-- REVISÃO DA FOTO -->
        <section id="screen-review" class="screen">
            <h1 class="arcade-title" style="font-size: 1.3rem;">CONFIRMAR FOTO</h1>
            <p class="subtitle">Sua imagem atende ao desafio?</p>

            <div style="flex: 1; background: #000; border-radius: var(--radius-main); overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1);">
                <img id="review-target" src="" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn-game btn-green" onclick="App.confirmSnap()">✓ Validar Foto (+100 Bônus)</button>
                <button class="btn-game btn-subtle" onclick="App.openCam()">↻ Refazer Foto</button>
            </div>
        </section>

        <!-- RELATÓRIO FINAL -->
        <section id="screen-results" class="screen">
            <h1 class="arcade-title">FIM DA CAÇADA!</h1>
            <p class="subtitle">Missão Cumprida</p>

            <div class="hud-grid" style="margin-bottom: 16px;">
                <div class="hud-box">
                    <span class="lbl">Pontuação Total</span>
                    <span class="val" id="res-score" style="color: var(--neon-yellow);">0</span>
                </div>
                <div class="hud-box">
                    <span class="lbl">Maior Combo</span>
                    <span class="val" id="res-combo" style="color: var(--neon-magenta);">x1</span>
                </div>
                <div class="hud-box">
                    <span class="lbl">Concluídos</span>
                    <span class="val" id="res-count">0</span>
                </div>
            </div>

            <h2 style="font-size: 0.9rem; color: var(--neon-cyan); margin-bottom: 8px; text-transform: uppercase;">Galeria da Expedição</h2>
            <div class="gallery-container" id="res-gallery-grid"></div>

            <button class="btn-game btn-yellow" style="margin-top: auto;" onclick="App.showScreen('screen-menu')">Menu Principal</button>
        </section>
    </div>

    <script>
        /* --- MATRIZ GERADORA DE DESAFIOS (CORRIGIDA) --- */
        const Generator = {
            objetos: ["Uma porta ou janela", "Um meio de transporte", "Um objeto de metal", "Uma planta ou flor", "Algo de vidro", "Uma ferramenta", "Um calçado", "Uma cadeira ou assento", "Um livro ou papel", "Um dispositivo eletrônico"],
            iluminacao: ["sob luz solar direta", "imerso em sombras profundas", "com iluminação dramática", "com um brilho metálico ou reflexo", "sob luz fraca ou suave"],
            angulos: ["fotografado de baixo para cima", "visto de um ângulo rasante", "através de uma moldura natural", "visto através de um espelho/reflexo", "com enquadramento bem próximo (Macro)"],
            conceitos: ["que pareça abandonado", "que lembre uma figura humana ou rosto", "que pareça fora de lugar", "que passe uma sensação de mistério", "com cores contrastantes"],

            getItem(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            },

            build() {
                const isComplex = Math.random() > 0.3;
                const obj = this.getItem(this.objetos);
                
                if (isComplex) {
                    const ang = this.getItem(this.angulos);
                    const con = this.getItem(this.conceitos);
                    return {
                        cat: "COMBINAÇÃO CRIATIVA",
                        text: `Fotografe ${obj.toLowerCase()}, ${ang}, ${con}.`,
                        pts: 250
                    };
                } else {
                    const ilu = this.getItem(this.iluminacao);
                    return {
                        cat: "OBSERVAÇÃO RÁPIDA",
                        text: `Encontre ${obj.toLowerCase()} ${ilu}.`,
                        pts: 150
                    };
                }
            }
        };

        /* --- MOTOR DO JOGO --- */
        const App = {
            config: { rounds: 5 },
            session: { round: 0, score: 0, combo: 1, maxCombo: 1, history: [], current: null },
            camStream: null,

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(id);
                if (target) target.classList.add('active');
            },

            setupGame(mode) {
                document.getElementById('config-subtitle').innerText = mode === 'surpresa' ? 'Modo Surpresa' : 'Modo Caçada Livre';
                this.showScreen('screen-config');
            },

            setCfg(key, val, el) {
                this.config[key] = val;
                document.querySelectorAll(`.cfg-${key}`).forEach(b => b.style.borderColor = 'rgba(255,255,255,0.15)');
                el.style.borderColor = 'var(--neon-cyan)';
            },

            startSession() {
                this.session = { round: 0, score: 0, combo: 1, maxCombo: 1, history: [], current: null };
                this.showScreen('screen-gameplay');
                this.nextTurn();
            },

            nextTurn() {
                this.session.round++;
                if (this.session.round > this.config.rounds) {
                    this.endGame();
                    return;
                }

                this.session.current = Generator.build();
                
                document.getElementById('hud-mira').innerText = `${this.session.round}/${this.config.rounds}`;
                document.getElementById('hud-score').innerText = this.session.score;
                document.getElementById('hud-combo').innerText = `x${this.session.combo}`;
                
                document.getElementById('card-cat-text').innerText = this.session.current.cat;
                document.getElementById('card-main-text').innerText = `"${this.session.current.text}"`;
            },

            skipMission() {
                this.session.combo = 1;
                this.triggerToast("Missão Pulada!");
                this.nextTurn();
            },

            completeManual() {
                this.processTurn(null);
            },

            async openCam() {
                try {
                    this.camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('cam-viewport').srcObject = this.camStream;
                    this.showScreen('screen-cam');
                } catch (e) {
                    alert("Câmera indisponível. Use a opção 'Concluir (Câmera Externa / Sem Foto)'.");
                }
            },

            closeCam() {
                if (this.camStream) {
                    this.camStream.getTracks().forEach(t => t.stop());
                }
                this.showScreen('screen-gameplay');
            },

            snap() {
                const vid = document.getElementById('cam-viewport');
                const cvs = document.getElementById('cam-canvas');
                cvs.width = vid.videoWidth || 640;
                cvs.height = vid.videoHeight || 480;
                cvs.getContext('2d').drawImage(vid, 0, 0, cvs.width, cvs.height);
                
                document.getElementById('review-target').src = cvs.toDataURL('image/jpeg', 0.8);
                this.closeCam();
                this.showScreen('scr
