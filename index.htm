<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Álbum Pessoal</title>

  <!-- Favicons e Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">

  <style>
    :root {
      --bg-main: #f8f6f0;
      --surface: #ffffff;
      --surface-subtle: #f0ede6;
      --text-primary: #1c1a17;
      --text-secondary: #706c64;
      --accent: #2c2a29;
      --border-color: rgba(0, 0, 0, 0.08);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root.auto-dark {
        --bg-main: #121212;
        --surface: #1e1e1e;
        --surface-subtle: #2c2c2c;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --accent: #ffffff;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    #album {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 80px);
    }

    /* Trava de Segurança por PIN */
    #lock-screen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .pin-input { font-size: 24px; letter-spacing: 12px; text-align: center; width: 160px; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--surface); color: var(--text-primary); outline: none; margin-top: 15px; }

    /* Navegação por Abas */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: var(--radius-md); }
    .tab-btn.active { background: var(--surface); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Elementos Visuais da Galeria */
    .al-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .al-brand { display: flex; align-items: center; gap: 10px; }
    .al-logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 2px solid var(--surface); }
    .al-author { font-size: 12px; font-weight: 700; color: var(--text-primary); }

    .al-header { padding: 8px 0 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
    .al-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; outline: none; }
    .al-sub { font-size: 14px; color: var(--text-secondary); outline: none; }

    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .chip { padding: 6px 14px; border-radius: 20px; background: var(--surface); color: var(--text-secondary); font-size: 12px; font-weight: 600; border: 1px solid var(--border-color); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--accent); color: var(--bg-main); border-color: var(--accent); }

    .al-search-input, .al-input, .al-select { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); outline: none; margin-bottom: 10px; }

    .al-actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn { padding: 12px; border: 1px solid transparent; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); color: var(--text-primary); transition: transform 0.15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: var(--bg-main); }
    .btn-outlined { border-color: var(--border-color); }

    #al-file, #al-restore-file { display: none; }

    /* Grade de Fotos */
    .al-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 601px) { .al-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 901px) { .al-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

    .al-card { background: var(--surface); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; position: relative; }
    .al-photo-wrapper { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background-color: var(--surface-subtle); }
    .al-photo { width: 100%; height: 100%; object-fit: cover; }
    .al-card-fav { position: absolute; top: 8px; right: 8px; font-size: 16px; color: #e53935; }
    .al-info { padding: 10px; }
    .al-cap { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Pinch-to-zoom Container */
    .zoom-container { overflow: hidden; touch-action: none; display: flex; justify-content: center; align-items: center; }
    .zoom-container img { transition: transform 0.1s ease-out; transform-origin: center center; }

    /* Modais */
    .al-modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .al-modal-bg.open { opacity: 1; pointer-events: auto; }
    .al-modal { background: var(--surface); width: 100%; max-width: 600px; padding: 20px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-height: 90vh; overflow-y: auto; }
    @media (min-width: 601px) { .al-modal { border-radius: var(--radius-lg); margin: auto; } .al-modal-bg { align-items: center; } }

    /* Modo Livro */
    .book-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 3000; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .book-modal-bg.open { opacity: 1; pointer-events: auto; }
    .book-header { padding: 16px 20px; display: flex; justify-content: space-between; color: #fff; }
    .book-viewport { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .book-page { background: var(--surface); width: 100%; max-width: 480px; border-radius: var(--radius-lg); padding: 20px; text-align: center; color: var(--text-primary); }

    .al-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-primary); color: var(--surface); padding: 10px 20px; border-radius: 30px; font-size: 12px; transition: transform 0.3s ease; z-index: 4000; }
    .al-toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Tela de Segurança por PIN (Opcional) -->
<div id="lock-screen" style="display: none;">
  <div style="font-size: 18px; font-weight: 700;">Álbum Protegido</div>
  <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Digite seu PIN de 4 dígitos</div>
  <input type="password" id="pin-entry" class="pin-input" maxlength="4" autofocus>
</div>

<div id="album">
  <!-- Topo -->
  <div class="al-top-bar">
    <div class="al-brand">
      <img class="al-logo-img" id="app-logo" alt="Logo">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600;">Galeria Pessoal</span>
        <span class="al-author">By.Wadson</span>
      </div>
    </div>
  </div>

  <!-- Navegação por Abas -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="tab-galeria">📷 Galeria</button>
    <button class="tab-btn" data-tab="tab-pastas">📁 Álbuns</button>
    <button class="tab-btn" data-tab="tab-ajustes">⚙️ Ajustes</button>
  </div>

  <!-- ABA 1: GALERIA -->
  <div class="tab-content active" id="tab-galeria">
    <div class="al-header">
      <div class="al-title" id="al-title" contenteditable="true">Minhas Memórias</div>
      <div class="al-sub" id="al-sub" contenteditable="true">Toque aqui para alterar o subtítulo</div>
    </div>

    <!-- Filtros e Busca -->
    <div class="filter-bar" id="filter-bar">
      <button class="chip active" data-filter="all">Todas</button>
      <button class="chip" data-filter="favs">♥ Favoritas</button>
      <button class="chip" data-filter="tag-Viagem">Viagem</button>
      <button class="chip" data-filter="tag-Família">Família</button>
      <button class="chip" data-filter="tag-Retrato">Retrato</button>
      <button class="chip" data-filter="tag-Pessoal">Pessoal</button>
    </div>

    <input type="text" id="al-search" class="al-search-input" placeholder="🔍 Buscar por legenda, local ou tag...">

    <!-- Ações e Ordenação -->
    <div class="al-actions">
      <button class="btn btn-primary" id="al-open-picker"> Nova Foto</button>
      <select id="al-sort" class="al-select" style="margin-bottom:0;">
        <option value="newest">Mais Recentes</option>
        <option value="oldest">Mais Antigas</option>
        <option value="az">A-Z Legenda</option>
      </select>
      <button class="btn btn-outlined" id="al-open-book">📖 Livro</button>
    </div>

    <div style="font-size: 12px; color: var(--text-secondary); margin: 12px 0;" id="al-count">0 fotos salvas</div>
    <div class="al-grid" id="al-grid"></div>
  </div>

  <!-- ABA 2: ÁLBUNS / PASTAS -->
  <div class="tab-content" id="tab-pastas">
    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <input type="text" id="new-folder-name" class="al-input" placeholder="Nome do novo álbum..." style="margin-bottom:0;">
      <button class="btn btn-primary" id="add-folder-btn">Criar Pasta</button>
    </div>
    <div id="folders-list" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>
  </div>

  <!-- ABA 3: AJUSTES -->
  <div class="tab-content" id="tab-ajustes">
    <div style="background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 12px;">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">🔒 Segurança</div>
      <label style="font-size: 13px; display: block; margin-bottom: 8px;">
        PIN de Acesso (Deixe em branco para desativar):
      </label>
      <input type="password" id="set-pin-input" class="al-input" placeholder="Ex: 1234" maxlength="4">
      <button class="btn btn-outlined" id="save-pin-btn">Salvar PIN</button>
    </div>

    <div style="background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 12px;">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">🖼️ Qualidade das Fotos</div>
      <select id="compression-quality" class="al-select" style="margin-bottom:0;">
        <option value="0.85">Alta Qualidade (Maior espaço)</option>
        <option value="0.65" selected>Equilibrado (Recomendado)</option>
        <option value="0.45">Economia de Espaço (Baixa resolução)</option>
      </select>
    </div>

    <div style="background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">💾 Backup e Dados</div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-outlined" id="al-backup-btn" style="flex:1;">Exportar JSON</button>
        <button class="btn btn-outlined" id="al-restore-btn" style="flex:1;">Importar JSON</button>
      </div>
    </div>
  </div>

  <input type="file" id="al-file" accept="image/*">
  <input type="file" id="al-restore-file" accept=".json">
</div>

<!-- Modal Adicionar Foto -->
<div class="al-modal-bg" id="al-modal-bg">
  <div class="al-modal">
    <img id="al-preview" style="width: 100%; max-height: 240px; object-fit: contain; border-radius: var(--radius-md); margin-bottom: 10px;">
    <input class="al-input" id="al-caption" placeholder="Legenda da foto...">
    <input class="al-input" id="al-location" placeholder="📍 Localização (opcional)">
    <select class="al-select" id="al-tag">
      <option value="">Selecione uma Categoria/Tag</option>
      <option value="Viagem">Viagem</option>
      <option value="Família">Família</option>
      <option value="Retrato">Retrato</option>
      <option value="Pessoal">Pessoal</option>
    </select>
    <select class="al-select" id="al-folder-select">
      <option value="">Sem Pasta (Raiz)</option>
    </select>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outlined" id="al-cancel" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" id="al-save" style="flex:1">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Visualizar com Zoom -->
<div class="al-modal-bg" id="al-light-bg">
  <div class="al-modal">
    <div class="zoom-container" id="zoom-area">
      <img id="al-light-photo" style="width:100%; max-height:350px; object-fit:contain; border-radius:var(--radius-md);">
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0;">
      <button class="btn btn-outlined" id="al-fav-btn" style="color:#e53935;">♡ Favoritar</button>
      <button class="btn btn-outlined" id="al-light-download">💾 Baixar</button>
    </div>
    <input class="al-input" id="al-edit-caption" placeholder="Editar legenda...">
    <input class="al-input" id="al-edit-location" placeholder="📍 Localização">
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outlined" id="al-light-remove" style="flex:1; color:#e53935;">Excluir</button>
      <button class="btn btn-primary" id="al-light-save" style="flex:1">Atualizar</button>
    </div>
  </div>
</div>

<!-- Modal Modo Livro -->
<div class="book-modal-bg" id="book-modal">
  <div class="book-header">
    <span>Álbum Digital</span>
    <button class="btn btn-outlined" id="book-close" style="color:#fff;">Fechar</button>
  </div>
  <div class="book-viewport" id="book-viewport">
    <div class="book-page" id="book-page-content"></div>
  </div>
</div>

<div class="al-toast" id="al-toast"></div>

<script>
(function() {
  let db;
  const DB_NAME = "AlbumDB_V06";

  function initDB() {
    return new Promise((resolve) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onsuccess = (e) => { db = e.target.result; resolve(); };
      req.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" });
        if (!db.objectStoreNames.contains("folders")) db.createObjectStore("folders", { keyPath: "id" });
        if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
      };
    });
  }

  function dbSave(store, data) {
    return new Promise((r) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(data); tx.oncomplete = () => r(true); });
  }
  function dbGetAll(store) {
    return new Promise((r) => { const tx = db.transaction(store, "readonly"); const req = tx.objectStore(store).getAll(); req.onsuccess = () => r(req.result || []); });
  }
  function dbGet(store, key) {
    return new Promise((r) => { const tx = db.transaction(store, "readonly"); const req = tx.objectStore(store).get(key); req.onsuccess = () => r(req.result ? req.result.value : null); });
  }
  function dbDelete(store, key) {
    return new Promise((r) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).delete(key); tx.oncomplete = () => r(true); });
  }

  let entries = [], folders = [], pendingImage = null, activePhotoId = null, activeFilter = "all", currentFolderFilter = null;

  const LOGO_DATA = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231c2541'/><circle cx='50' cy='50' r='44' fill='none' stroke='%23ffb703' stroke-width='2'/><path d='M30,65 L50,35 L70,65 Z' fill='%236fffe9'/><circle cx='50' cy='42' r='6' fill='%23ffb703'/><text x='50' y='82' font-size='10' font-weight='bold' fill='%23ffffff' text-anchor='middle' font-family='sans-serif'>By.Wadson</text></svg>";

  window.addEventListener("DOMContentLoaded", async () => {
    document.getElementById("app-logo").src = LOGO_DATA;
    document.documentElement.classList.add("auto-dark");
    await initDB();

    // Trava por PIN
    const savedPin = await dbGet("settings", "user_pin");
    if (savedPin) {
      document.getElementById("lock-screen").style.display = "flex";
      document.getElementById("pin-entry").addEventListener("input", (e) => {
        if (e.target.value === savedPin) {
          document.getElementById("lock-screen").style.display = "none";
        }
      });
    }

    entries = await dbGetAll("photos");
    folders = await dbGetAll("folders");
    render();
    renderFolders();
    setupTabs();
    setupZoom();
  });

  // Sistema de Abas
  function setupTabs() {
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });
  }

  // Upload e Compressão Configurável
  document.getElementById("al-open-picker").addEventListener("click", () => document.getElementById("al-file").click());

  document.getElementById("al-file").addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const quality = parseFloat(document.getElementById("compression-quality").value || "0.65");
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX = 1200; let w = img.width, h = img.height;
        if (w > MAX) { h *= MAX / w; w = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        pendingImage = canvas.toDataURL("image/jpeg", quality);
        document.getElementById("al-preview").src = pendingImage;
        updateFolderSelectOptions();
        document.getElementById("al-modal-bg").classList.add("open");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    document.getElementById("al-file").value = "";
  });

  document.getElementById("al-save").addEventListener("click", async () => {
    if (!pendingImage) return;
    const newEntry = {
      id: "img_" + Date.now(), photo: pendingImage,
      caption: document.getElementById("al-caption").value.trim() || "Sem legenda",
      location: document.getElementById("al-location").value.trim() || "",
      tag: document.getElementById(
