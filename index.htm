<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Aperta - Jogo Narrativo de Fotografia do Mundo Real">
    <title>APERTA | Histórias Fotográficas</title>
    
    <!-- PWA Manifest Inline -->
    <link rel="manifest" href='data:application/json,{"name":"APERTA - Jogo Fotográfico","short_name":"APERTA","start_url":".","display":"standalone","background_color":"#121214","theme_color":"#121214","icons":[{"src":"https://via.placeholder.com/192x192/121214/ffffff?text=APERTA","sizes":"192x192","type":"image/png"},{"src":"https://via.placeholder.com/512x512/121214/ffffff?text=APERTA","sizes":"512x512","type":"image/png"}]}'>

    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --bg-primary: #121214;
            --bg-secondary: #1a1a1e;
            --bg-card: #202024;
            --bg-card-hover: #29292e;
            --text-primary: #f0f0f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #e11d48;
            --accent-hover: #f43f5e;
            --accent-glow: rgba(225, 29, 72, 0.25);
            --border: #27272a;
            --border-light: #3f3f46;
            --radius-s: 8px;
            --radius-m: 14px;
            --radius-l: 20px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px rgba(225, 29, 72, 0.2);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: "Georgia", "Times New Roman", serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f3f5;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --accent-glow: rgba(225, 29, 72, 0.15);
            --border: #e5e7eb;
            --border-light: #d1d5db;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-glow: 0 0 20px rgba(225, 29, 72, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* CONTAINER SIMULANDO APP MOBILE NO DESKTOP */
        #app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-primary);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--safe-bottom) + 70px);
        }

        /* HEADER & NAVBAR */
        .app-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .brand-logo span {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--bg-card-hover);
        }

        /* BOTTOM NAV BAR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: calc(65px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            width: 20%;
            transition: var(--transition);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* SCREEN MANAGEMENT */
        .screen {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease-out forwards;
            flex: 1;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TYPOGRAPHY & GENERAL UTILS */
        h1, h2, h3 { line-height: 1.2; font-weight: 700; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        h2 { font-size: 1.3rem; margin-bottom: 12px; }
        h3 { font-size: 1.1rem; margin-bottom: 6px; }
        p { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .badge-accent {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-m);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:active {
            background-color: var(--accent-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:active {
            background-color: var(--bg-card-hover);
            transform: scale(0.98);
        }

        /* CARDS & LISTS */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-m);
            padding: 18px;
            margin-bottom: 16px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .card:active {
            border-color: var(--border-light);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        /* HOME SCREEN STYLES */
        .hero-banner {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 150px;
            height: 150px;
            background: var(--accent-glow);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-s);
            padding: 12px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* NARRATIVE/MISSION DISPLAY */
        .story-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
            padding: 20px;
            margin-bottom: 20px;
        }

        .narrative-text {
            font-family: var(--font-serif);
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 3px solid var(--accent);
        }

        .mission-box {
            background: var(--bg-secondary);
            border: 1px dashed var(--accent);
            border-radius: var(--radius-m);
            padding: 16px;
            margin: 16px 0;
        }

        .mission-title {
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-s);
            padding: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* ALBUM EDITOR & VIEW */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .album-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-m);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .album-cover-placeholder {
            width: 100%;
            height: 120px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 2rem;
            background-size: cover;
            background-position: center;
        }

        .album-info {
            padding: 12px;
        }

        .page-editor-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-m);
            padding: 16px;
            margin-bottom: 16px;
        }

        .image-preview {
            width: 100%;
            height: 180px;
            border-radius: var(--radius-s);
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .page-layout-select {
            width: 100%;
            padding: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius-s);
            margin-bottom: 10px;
        }

        textarea.editable-text {
            width: 100%;
            padding: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius-s);
            font-family: var(--font-serif);
            resize: vertical;
            min-height: 70px;
            margin-bottom: 10px;
        }

        /* PRESENTATION MODE */
        .presentation-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .pres-image {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .pres-text {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            text-align: center;
            line-height: 1.6;
            max-width: 90%;
            color: #e4e4e7;
        }

        .pres-controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* MODAL & OVERLAYS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* ACHIEVEMENTS GRID */
        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .achieve-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-m);
            padding: 14px;
            opacity: 0.5;
            filter: grayscale(1);
            transition: var(--transition);
        }

        .achieve-card.unlocked {
            opacity: 1;
            filter: grayscale(0);
            border-color: var(--accent);
        }

        .achieve-icon {
            font-size: 2rem;
            background: var(--bg-secondary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .achieve-info {
            text-align: left;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius-s);
            font-size: 0.95rem;
        }

        /* TOAST NOTIFICATION */
        #toast {
            position: fixed;
            top: calc(var(--safe-top) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            z-index: 3000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- CONTAINER PRINCIPAL -->
    <div id="app-container">
        
        <!-- HEADER -->
        <header class="app-header">
            <div class="brand-logo">

        <section id="screen-home" class="screen active">
